services:
  - type: web
    name: danial-legal-assistant
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm run typecheck && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://jwhyeohqolabcbuwhfon.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
